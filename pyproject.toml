[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-constitution"
version = "0.1.0"
description = "Multi-agent governance framework with adversarial debate, epistemic honesty, and retrospective calibration"
readme = "README.md"
license = "Apache-2.0"
authors = [{name = "AgentPolis", email = "hs.ze.lab@gmail.com"}]
requires-python = ">=3.11"
keywords = ["multi-agent", "llm", "governance", "debate", "ai-agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "rich>=13.0.0",
    "pyyaml>=6.0",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40.0"]
dev = ["build>=1.2", "pytest>=8.0", "ruff>=0.4"]

[project.scripts]
ac = "constitution.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.setuptools.packages.find]
where = ["."]
include = ["constitution*", "adapters*"]
